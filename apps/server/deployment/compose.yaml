services:
  origin:
    build:
      context: ../../..
      dockerfile: apps/server/deployment/Dockerfile
    image: ${ASTRO_ORIGIN_IMAGE:?Set the immutable origin image in the Compose environment file}
    env_file: ${ASTRO_ORIGIN_ENV_FILE:?Set the host-managed origin environment file in the Compose environment file}
    environment:
      ASTRO_SERVER_BIND: 0.0.0.0
      ASTRO_LOCAL_OWNER_PORT: 8081
      ASTRO_REMOTE_DESKTOP_PORT: 8082
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    expose: ['8080', '8081', '8082']
    ports:
      - 127.0.0.1:${ASTRO_REMOTE_HOST_PORT:-18080}:8080
      - 127.0.0.1:${ASTRO_LOCAL_OWNER_HOST_PORT:-18081}:8081
      - 127.0.0.1:${ASTRO_REMOTE_DESKTOP_HOST_PORT:-18082}:8082
    volumes:
      - type: volume
        source: astro_console_state
        target: /var/lib/astro-console
      - type: bind
        source: ${ASTRO_DOWNLOAD_GRANT_SHARED_SECRET_HOST_PATH:?Set shared signer secret path in the Compose environment file}
        target: /run/secrets/download-grant-shared-secret
        read_only: true
      - type: bind
        source: ${ASTRO_MEMBERSHIP_BOOTSTRAP_HOST_PATH:?Set membership bootstrap path in the Compose environment file}
        target: /run/config/membership-bootstrap.json
        read_only: true
  download-grant:
    profiles: [download]
    image: ${ASTRO_ORIGIN_IMAGE:?Set the immutable origin image in the Compose environment file}
    command:
      [
        'node',
        '--experimental-strip-types',
        'src/workers/download-grant-service.ts',
      ]
    env_file: ${ASTRO_DOWNLOAD_GRANT_ENV_FILE:?Set the host-managed signer environment file in the Compose environment file}
    environment:
      ASTRO_DOWNLOAD_GRANT_PORT: 8791
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    expose: ['8791']
    volumes:
      - type: bind
        source: ${R2_DOWNLOAD_CREDENTIALS_HOST_PATH:?Set dedicated read-only R2 credential path in the Compose environment file}
        target: /run/secrets/r2-download-credentials.json
        read_only: true
      - type: bind
        source: ${ASTRO_DOWNLOAD_GRANT_SHARED_SECRET_HOST_PATH:?Set shared signer secret path in the Compose environment file}
        target: /run/secrets/download-grant-shared-secret
        read_only: true
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:REPLACE_WITH_PINNED_RELEASE
    command: ['tunnel', '--no-autoupdate', 'run']
    depends_on: [origin]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Supply the tunnel credential through a host-managed secret at activation.

volumes:
  astro_console_state: {}
