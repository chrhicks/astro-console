services:
  publisher:
    profiles: [publisher]
    image: ghcr.io/chicks/astro-console:REPLACE_WITH_PINNED_RELEASE
    command: ['node', '--experimental-strip-types', 'src/publisher-service.ts']
    env_file: ${ASTRO_PUBLISHER_ENV_FILE:?Set the host-managed publisher environment file in the Compose environment file}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    volumes:
      - type: volume
        source: astro_console_state
        target: /var/lib/astro-console
      - type: bind
        source: ${ASTRO_PUBLISHER_OUTPUTS_HOST_PATH:?Set an absolute app-owned promoted-output path in the Compose environment file}
        target: /var/lib/astro-console/outputs
        read_only: true
      - type: bind
        source: ${R2_CREDENTIALS_HOST_PATH:?Set an absolute host-managed R2 secret path in the Compose environment file}
        target: /run/secrets/r2-credentials.json
        read_only: true
