services:
  origin:
    build:
      context: ../../..
      dockerfile: apps/v2-local-web/deployment/Dockerfile
    image: ghcr.io/chicks/astro-console:REPLACE_WITH_PINNED_RELEASE
    env_file: ${ASTRO_ORIGIN_ENV_FILE:?Set the host-managed origin environment file in the Compose environment file}
    environment:
      ASTRO_LOCAL_WEB_BIND: 0.0.0.0
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    expose: ["8080"]
    volumes:
      - type: volume
        source: astro_console_state
        target: /var/lib/astro-console
      - type: bind
        source: ${ASTRO_DOWNLOAD_GRANT_SHARED_SECRET_HOST_PATH:?Set shared signer secret path in the Compose environment file}
        target: /run/secrets/download-grant-shared-secret
        read_only: true
  download-grant:
    profiles: [download]
    image: ghcr.io/chicks/astro-console:REPLACE_WITH_PINNED_RELEASE
    command: ["node", "--experimental-strip-types", "src/download-grant-service.ts"]
    env_file: ${ASTRO_DOWNLOAD_GRANT_ENV_FILE:?Set the host-managed signer environment file in the Compose environment file}
    environment:
      ASTRO_DOWNLOAD_GRANT_PORT: 8791
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    expose: ["8791"]
    volumes:
      - type: bind
        source: ${R2_DOWNLOAD_CREDENTIALS_HOST_PATH:?Set dedicated read-only R2 credential path in the Compose environment file}
        target: /run/secrets/r2-download-credentials.json
        read_only: true
      - type: bind
        source: ${ASTRO_DOWNLOAD_GRANT_SHARED_SECRET_HOST_PATH:?Set shared signer secret path in the Compose environment file}
        target: /run/secrets/download-grant-shared-secret
        read_only: true
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:REPLACE_WITH_PINNED_RELEASE
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on: [origin]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Supply the tunnel credential through a host-managed secret at activation.

volumes:
  astro_console_state: {}
