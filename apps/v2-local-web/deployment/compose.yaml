services:
  origin:
    build:
      context: ../../..
      dockerfile: apps/v2-local-web/deployment/Dockerfile
    image: ghcr.io/chicks/astro-console:REPLACE_WITH_PINNED_RELEASE
    env_file: config.env
    environment:
      ASTRO_LOCAL_WEB_BIND: 0.0.0.0
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    expose: ["8080"]
    volumes:
      - type: volume
        source: astro_console_state
        target: /var/lib/astro-console
  rig-worker:
    profiles: [rig]
    image: ghcr.io/chicks/astro-console:REPLACE_WITH_PINNED_RELEASE
    command: ["node", "--experimental-strip-types", "src/rig-worker.ts"]
    env_file: config.env
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    volumes:
      - type: volume
        source: astro_console_state
        target: /var/lib/astro-console
      - type: bind
        source: ${ASTRO_SEESTAR_PEM_HOST_PATH:?Set an absolute host-managed PEM path in config.env}
        target: /run/secrets/seestar.pem
        read_only: true
  cloudflared:
    image: cloudflare/cloudflared:REPLACE_WITH_PINNED_RELEASE
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on: [origin]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Supply the tunnel credential through a host-managed secret at activation.

volumes:
  astro_console_state: {}
