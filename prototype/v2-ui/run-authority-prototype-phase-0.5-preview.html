<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A scenario-driven V2 prototype for run mutation, reconnect, presence, and control ownership.">
  <title>Authority · Phase 0.5 Clean Preview</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="phase-0.5-variant-shell.css?v=2">

</head>
<body>
  <a class="skip-link" href="#main">Skip to run authority prototype</a>
    <header class="phase-anchor"><a class="phase-brand" href="index.html"><span aria-hidden="true">✦</span>Astro <b>Console</b></a><div class="phase-register"><span><strong>M31</strong> · active observatory run</span><span>Controller <strong>Chris</strong></span><span>Evidence age <strong>2 sec</strong></span></div><div class="phase-truth">SERVICE TRUTH</div></header><nav class="phase-nav" aria-label="Phase 1 workspace navigation"><a href="composite-prototype-phase-0.5-preview.html">Plan</a><a href="acquire-prototype-phase-0.5-preview.html">Observe</a><a href="composite-prototype-phase-0.5-preview.html">Library</a><a href="process-prototype-phase-0.5-preview.html">Process</a><span aria-current="page">Authority</span></nav>

  <main id="main" class="page composite-page authority-page phase-0-5-application">

    <section class="composite-shell authority-shell" aria-label="Run authority application prototype">
      <nav class="composite-rail desktop-only" aria-label="Workspaces">
        <div class="composite-rail-brand" aria-hidden="true">✦</div>
        <span class="authority-rail-item" data-workspace-item="plan"><span aria-hidden="true">◇</span><span class="rail-label">Plan</span></span>
        <span class="authority-rail-item active" aria-current="page" data-workspace-item="observe"><span aria-hidden="true">◉</span><span class="rail-label">Observe</span><span class="rail-signal" aria-hidden="true"></span></span>
        <span class="authority-rail-item"><span aria-hidden="true">▧</span><span class="rail-label">Library</span></span>
        <span class="authority-rail-item"><span aria-hidden="true">⌁</span><span class="rail-label">Process</span></span>
      </nav>

      <div class="composite-main">
        <header class="composite-runbar authority-runbar" data-runbar></header>
        <section class="desktop-experience authority-desktop" data-authority-content aria-live="polite"></section>
        <section class="phone-monitor" data-authority-phone aria-label="Read-only phone monitor"></section>
        <p class="composite-feedback" data-feedback hidden role="status"></p>
      </div>

      <aside class="composite-context desktop-only" aria-label="Run context">
        <div class="context-tabs" role="tablist" aria-label="Context rail">
          <button type="button" role="tab" aria-controls="authority-context-panel" data-context-tab="inspector">Inspector</button>
          <button type="button" role="tab" aria-controls="authority-context-panel" data-context-tab="alerts">Alerts <span data-alert-count></span></button>
        </div>
        <div id="authority-context-panel" class="context-content" role="tabpanel" data-authority-context></div>
      </aside>
    </section>

      </main>

  <script src="run-authority-prototype-phase-0.5-preview.js"></script>
</body>
</html>
